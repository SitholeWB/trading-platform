name: Release Multi-Platform Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v3.1.1)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Desktop (Linux .deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev python3-pil rpm zstd curl file

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Version & Env
        id: meta
        working-directory: desktop
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ ! -f .env.json ]; then echo '{}' > .env.json; fi

      - name: Build Flutter Linux & Package All Distros
        working-directory: desktop
        run: |
          VER="${{ steps.meta.outputs.version }}"
          flutter pub get
          flutter build linux --release --dart-define-from-file=.env.json
          chmod +x packaging/package-linux-*.sh packaging/linux-stage-helpers.sh
          ./packaging/package-linux-deb.sh "$VER"
          ./packaging/package-linux-rpm.sh "$VER"
          ./packaging/package-linux-appimage.sh "$VER"
          ./packaging/package-linux-arch.sh "$VER"
          ./packaging/package-linux-tarball.sh "$VER"

      - name: Archive Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/build/*.deb
            desktop/build/*.rpm
            desktop/build/Trading_Platform-*.AppImage
            desktop/build/*.pkg.tar.zst
            desktop/build/*.tar.gz
          retention-days: 14

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            desktop/build/*.deb
            desktop/build/*.rpm
            desktop/build/Trading_Platform-*.AppImage
            desktop/build/*.pkg.tar.zst
            desktop/build/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

  build-windows:
    name: Build Desktop (Windows .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Version & Env
        id: meta
        shell: pwsh
        working-directory: desktop
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\+\s]+)').Matches[0].Groups[1].Value
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not (Test-Path .env.json)) { '{}' | Out-File -FilePath .env.json -Encoding utf8 }

      - name: Build Flutter Windows
        working-directory: desktop
        run: |
          flutter pub get
          flutter build windows --release --dart-define-from-file=.env.json

      - name: Install WiX Toolset & Build .msi
        shell: pwsh
        working-directory: desktop
        run: |
          dotnet tool install --global wix --version 5.0.2
          $ver = "${{ steps.meta.outputs.version }}"
          $srcDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $iconPath = (Resolve-Path "windows\runner\resources\app_icon.ico").Path
          $outMsi = "build\trading-platform_${ver}_x64.msi"
          wix build packaging/windows-installer.wxs `
            -arch x64 `
            -d Version=$ver `
            -d SourceDir="$srcDir" `
            -d IconPath="$iconPath" `
            -o "$outMsi"
          $sizeMB = [math]::Round((Get-Item $outMsi).Length / 1MB, 2)
          Write-Host "Built $outMsi ($sizeMB MB)"
          if ($sizeMB -lt 10) {
            throw "MSI is unexpectedly small ($sizeMB MB); aborting."
          }

      - name: Archive Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/build/*.msi
          retention-days: 14

      - name: Upload Windows Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: desktop/build/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false

  build-macos:
    name: Build Desktop (macOS .dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Version & Env
        id: meta
        working-directory: desktop
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ ! -f .env.json ]; then echo '{}' > .env.json; fi

      - name: Build Flutter macOS
        working-directory: desktop
        run: |
          flutter pub get
          flutter build macos --release --dart-define-from-file=.env.json

      - name: Package .dmg & .zip
        working-directory: desktop
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APP_PATH="build/macos/Build/Products/Release/Trading Platform.app"
          STAGE_DIR="build/dmg-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "Trading Platform" \
            -srcfolder "$STAGE_DIR" \
            -ov -format UDZO \
            "build/trading-platform_${VERSION}_macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "build/trading-platform_${VERSION}_macos.zip"

      - name: Archive macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            desktop/build/*.dmg
            desktop/build/*.zip
          retention-days: 14

      - name: Upload macOS Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            desktop/build/*.dmg
            desktop/build/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
