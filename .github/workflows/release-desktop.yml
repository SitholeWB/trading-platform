name: Release Multi-Platform Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.1)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-desktop-terminal:
    name: Build Desktop (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: Linux (Snap, DEB, AppImage)
            target_flag: all-linux
            artifact_name: desktop-linux
          - os: windows-latest
            target_name: Windows (Setup .exe & Portable)
            target_flag: win
            artifact_name: desktop-windows
          - os: macos-latest
            target_name: macOS (.dmg & .zip)
            target_flag: mac
            artifact_name: desktop-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/Presentation/TradingPlatform.Web/package-lock.json'

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Frontend Dependencies
        shell: bash
        run: npm ci
        working-directory: src/Presentation/TradingPlatform.Web

      - name: Package Desktop Distribution (${{ matrix.target_flag }})
        shell: bash
        run: |
          chmod +x ./scripts/package-electron.sh
          ./scripts/package-electron.sh ${{ matrix.target_flag }}

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src/Presentation/TradingPlatform.Electron/dist/release/*.snap
            src/Presentation/TradingPlatform.Electron/dist/release/*.deb
            src/Presentation/TradingPlatform.Electron/dist/release/*.AppImage
            src/Presentation/TradingPlatform.Electron/dist/release/*.exe
            src/Presentation/TradingPlatform.Electron/dist/release/*.dmg
            src/Presentation/TradingPlatform.Electron/dist/release/*.zip
          retention-days: 14

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            src/Presentation/TradingPlatform.Electron/dist/release/*.snap
            src/Presentation/TradingPlatform.Electron/dist/release/*.deb
            src/Presentation/TradingPlatform.Electron/dist/release/*.AppImage
            src/Presentation/TradingPlatform.Electron/dist/release/*.exe
            src/Presentation/TradingPlatform.Electron/dist/release/*.dmg
            src/Presentation/TradingPlatform.Electron/dist/release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Snap Store (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: canonical/action-publish@v1
        with:
          store_token: ${{ env.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: src/Presentation/TradingPlatform.Electron/dist/release/trading-platform_*.snap
          channel: stable
