app-id: com.tradingplatform.desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: trading-platform-wrapper
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --env=TMPDIR=/var/tmp
  - --env=DOTNET_CLI_TELEMETRY_OPTOUT=1

modules:
  - name: trading-platform
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main
      - cp -r linux-unpacked/* /app/main/
      - chmod +x /app/main/trading-platform
      - chmod +x /app/main/resources/backend/TradingPlatform.Api
      - install -Dm755 run.sh /app/bin/trading-platform-wrapper
      - install -Dm644 com.tradingplatform.desktop.desktop /app/share/applications/com.tradingplatform.desktop.desktop
      - install -Dm644 com.tradingplatform.desktop.metainfo.xml /app/share/metainfo/com.tradingplatform.desktop.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.tradingplatform.desktop.png
    sources:
      - type: dir
        path: ../dist/release/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: run.sh
      - type: file
        path: com.tradingplatform.desktop.desktop
      - type: file
        path: com.tradingplatform.desktop.metainfo.xml
      - type: file
        path: ../assets/icon.png
        dest-filename: icon-512.png

