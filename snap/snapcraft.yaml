name: trading-platform
base: core22
version: '1.0.0'
summary: Institutional Algorithmic Trading Platform, Live Charts & AI Copilot
description: |
  Trading Platform is an institutional-grade desktop trading terminal featuring:
  - Real-time Multi-Timeframe Candlestick Charts (1m, 5m, 15m, 1h, 4h, 1d)
  - 10+ Technical Indicators (EMA, SMA, RSI, MACD, Bollinger Bands, ATR, VWAP)
  - Autonomous Multi-Strategy Market Scanner
  - Strict Risk Management Guardrails & Quick Order Widget
  - Integrated AI Market Copilot with contextual trade commentary
  - Native Photino.NET lightweight desktop client

grade: stable
confinement: strict
compression: xz

architectures:
  - build-on: amd64

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0:
    bind: $SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/webkit2gtk-4.0

apps:
  trading-platform:
    command: bin/launcher.sh
    desktop: snap/gui/trading-platform.desktop
    extensions: [ gnome ]
    plugs:
      - browser-support
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - network
      - network-bind
      - opengl
      - audio-playback
      - home
      - removable-media
    environment:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      WEBKIT_DMABUF_RENDERER_DISABLE_GBM: "1"
      GTK_THEME: "Adwaita:dark"
      TRADING_PLATFORM_DATA_DIR: "$SNAP_USER_DATA/data"

parts:
  trading-platform:
    plugin: nil
    stage-packages:
      - libwebkit2gtk-4.0-37
      - libjavascriptcoregtk-4.0-18
      - libnotify4
      - libicu70
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin"

      # 1. Check for pre-built binaries in dist/snap-payload or deb_build
      if [ -d "$CRAFT_PROJECT_DIR/dist/snap-payload" ] && [ -f "$CRAFT_PROJECT_DIR/dist/snap-payload/TradingPlatform.Desktop" ]; then
          echo "--> Copying pre-built payload from dist/snap-payload..."
          cp -r "$CRAFT_PROJECT_DIR/dist/snap-payload/"* "$CRAFT_PART_INSTALL/bin/"
      elif [ -d "/home/wb-sithole/.gemini/antigravity/scratch/deb_build/opt/trading-platform" ]; then
          echo "--> Copying payload from deb_build..."
          cp -r /home/wb-sithole/.gemini/antigravity/scratch/deb_build/opt/trading-platform/* "$CRAFT_PART_INSTALL/bin/"
      else
          echo "--> Building Trading Platform from source inside snapcraft..."
          if ! command -v dotnet >/dev/null 2>&1; then
              echo "Installing .NET SDK..."
              curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              /tmp/dotnet-install.sh --channel 10.0 --install-dir /tmp/dotnet
              export PATH="/tmp/dotnet:$PATH"
          fi
          dotnet restore "$CRAFT_PROJECT_DIR/src/Presentation/TradingPlatform.Desktop/TradingPlatform.Desktop.csproj" -r linux-x64 -p:NuGetAudit=false
          dotnet publish "$CRAFT_PROJECT_DIR/src/Presentation/TradingPlatform.Desktop/TradingPlatform.Desktop.csproj" \
              -c Release \
              -r linux-x64 \
              --self-contained true \
              --no-restore \
              -p:NuGetAudit=false \
              -o "$CRAFT_PART_INSTALL/bin"
          cp -r "$CRAFT_PROJECT_DIR/src/Presentation/TradingPlatform.Api/wwwroot" "$CRAFT_PART_INSTALL/bin/wwwroot"
      fi

      # 2. Stage launcher script
      cp "$CRAFT_PROJECT_DIR/snap/local/launcher.sh" "$CRAFT_PART_INSTALL/bin/launcher.sh"
      chmod +x "$CRAFT_PART_INSTALL/bin/launcher.sh"
      chmod +x "$CRAFT_PART_INSTALL/bin/TradingPlatform.Desktop"
